[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scbrcstates"
version = "0.1.0"
description = "Classifier for malignant breast cancer cell states from scRNA-seq data."
readme = "README.md"
requires-python = ">=3.11,<3.12"

authors = [
    {name = "Quentin Rott"}
]

license = {text = "MIT"}

dependencies = [
    "anndata>=0.10,<1.0",
    "joblib>=1.3,<2",
    "numpy>=1.23,<2",
    "scipy>=1.9,<2",
    "scikit-learn==1.3.2"
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pandas>=1.5"
]

[project.scripts]
scbrcstates = "scbrcstates.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scbrcstates = ["models/*.joblib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]